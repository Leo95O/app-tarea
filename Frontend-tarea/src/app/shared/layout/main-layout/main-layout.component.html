<mat-sidenav-container class="h-screen bg-background">
  
  <mat-sidenav 
    #sidenav 
    [mode]="isMobile() ? 'over' : 'side'" 
    [opened]="isSidebarOpen()" 
    class="w-64 border-r border-slate-200 bg-white shadow-sm z-50"
  >
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
      <div class="flex items-center gap-2 text-primary font-bold text-xl">
        <mat-icon class="text-info">dataset</mat-icon>
        <span>Gestor V6</span>
      </div>
    </div>

    <mat-nav-list class="pt-4 px-2 space-y-1">
      
      <a mat-list-item routerLink="/tareas" (click)="closeOnMobile()" routerLinkActive="bg-blue-50 text-info font-medium rounded-lg" class="rounded-lg hover:bg-slate-50 transition-colors mb-1">
        <mat-icon matListItemIcon class="text-slate-500" routerLinkActive="text-info">dashboard</mat-icon>
        <span matListItemTitle>Mis Tareas</span>
      </a>

      <a mat-list-item routerLink="/usuarios" (click)="closeOnMobile()" routerLinkActive="bg-blue-50 text-info font-medium rounded-lg" class="rounded-lg hover:bg-slate-50 transition-colors mb-1">
        <mat-icon matListItemIcon class="text-slate-500" routerLinkActive="text-info">group</mat-icon>
        <span matListItemTitle>Personal</span>
      </a>

      <a mat-list-item routerLink="/analytics" (click)="closeOnMobile()" routerLinkActive="bg-blue-50 text-info font-medium rounded-lg" class="rounded-lg hover:bg-slate-50 transition-colors">
        <mat-icon matListItemIcon class="text-slate-500" routerLinkActive="text-info">bar_chart</mat-icon>
        <span matListItemTitle>Análisis</span>
      </a>

    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col h-full bg-background transition-all duration-300">
    
    <mat-toolbar class="!bg-white !shadow-sm border-b border-slate-200 px-4 flex justify-between items-center sticky top-0 z-40">
      <div class="flex items-center gap-4">
        <button mat-icon-button (click)="toggleSidebar()">
          <mat-icon>menu</mat-icon>
        </button>
        <h2 class="text-base m-0 text-slate-700 hidden md:block">
          Sucursal: <span class="font-bold text-slate-900">LIMA CENTRAL</span>
        </h2>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <p class="text-sm font-medium text-slate-800 m-0 leading-tight">
            {{ authService.currentUser()?.nombre_completo }}
          </p>
          <p class="text-xs text-slate-500 m-0">
            {{ authService.currentUser()?.rol }}
          </p>
        </div>
        <button mat-icon-button [matMenuTriggerFor]="userMenu" class="!bg-slate-100">
          <mat-icon class="text-slate-600">person</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item>
            <mat-icon>account_circle</mat-icon>
            <span>Mi Perfil</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon class="text-danger">logout</mat-icon>
            <span class="text-danger">Cerrar Sesión</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 relative w-full">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
